<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0B0D" />
      <stop offset="100%" stop-color="#141418" />
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CDB78F" />
      <stop offset="100%" stop-color="#BAA47B" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" rx="20" fill="url(#bg)" stroke="#27272D" stroke-width="1.5" />

  <!-- Title Badge -->
  <rect x="36" y="28" width="180" height="32" rx="16" fill="#18181D" stroke="#27272D" stroke-width="1" />
  <text x="126" y="49" fill="#CDB78F" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" text-anchor="middle">SYSTEM ARCHITECTURE</text>

  <!-- Layer 1: Avalonia UI -->
  <g transform="translate(36, 80)">
    <rect width="888" height="64" rx="14" fill="#121215" stroke="#27272D" stroke-width="1" />
    <text x="24" y="38" fill="#F1EFEA" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Avalonia 12 UI</text>
    <text x="140" y="38" fill="#9A978F" font-family="Inter, system-ui, sans-serif" font-size="13">HomeView · DisplaysView · WirelessView · SettingsView · Vector SceneControl (30 fps)</text>
  </g>

  <!-- Layer 2: Core Engine & MVVM -->
  <g transform="translate(36, 164)">
    <rect width="888" height="72" rx="14" fill="#121215" stroke="#27272D" stroke-width="1" />
    <text x="24" y="42" fill="#F1EFEA" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Pure C# Engine</text>
    <g transform="translate(150, 18)">
      <!-- BestModePicker -->
      <rect x="0" y="0" width="150" height="36" rx="8" fill="#18181D" stroke="#CDB78F" stroke-width="1" />
      <text x="75" y="23" fill="#CDB78F" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">BestModePicker</text>
      <!-- EdidParser -->
      <rect x="165" y="0" width="140" height="36" rx="8" fill="#18181D" stroke="#CDB78F" stroke-width="1" />
      <text x="235" y="23" fill="#CDB78F" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">128-Byte EdidParser</text>
      <!-- SceneLayout -->
      <rect x="320" y="0" width="130" height="36" rx="8" fill="#18181D" stroke="#CDB78F" stroke-width="1" />
      <text x="385" y="23" fill="#CDB78F" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">SceneLayout Math</text>
      <!-- Fail-Safe Revert -->
      <rect x="465" y="0" width="155" height="36" rx="8" fill="#18181D" stroke="#86B894" stroke-width="1" />
      <text x="542" y="23" fill="#86B894" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">12s Fail-Safe Engine</text>
    </g>
  </g>

  <!-- Layer 3: Platform Abstraction Interfaces -->
  <g transform="translate(36, 256)">
    <rect width="888" height="60" rx="14" fill="#16161B" stroke="#3A3A44" stroke-width="1" stroke-dasharray="4,4" />
    <text x="24" y="36" fill="#CDB78F" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Interfaces (DI)</text>
    <text x="140" y="36" fill="#F1EFEA" font-family="Inter, system-ui, sans-serif" font-size="12">IDisplayService · IEdidReader · IScreenModeService · IWallpaperService · IWirelessDisplayLauncher · IAutostartService</text>
  </g>

  <!-- Layer 4: Native OS Implementations -->
  <g transform="translate(36, 336)">
    <!-- Windows -->
    <g transform="translate(0, 0)">
      <rect width="280" height="114" rx="14" fill="#121215" stroke="#27272D" stroke-width="1" />
      <text x="20" y="32" fill="#F1EFEA" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Windows (user32)</text>
      <text x="20" y="58" fill="#9A978F" font-family="Inter, system-ui, sans-serif" font-size="12">• EnumDisplayDevices / DEVMODEW</text>
      <text x="20" y="78" fill="#9A978F" font-family="Inter, system-ui, sans-serif" font-size="12">• CDS_TEST → Registry commit</text>
      <text x="20" y="98" fill="#9A978F" font-family="Inter, system-ui, sans-serif" font-size="12">• HKLM Display Registry EDID</text>
    </g>

    <!-- macOS -->
    <g transform="translate(304, 0)">
      <rect width="280" height="114" rx="14" fill="#121215" stroke="#27272D" stroke-width="1" />
      <text x="20" y="32" fill="#F1EFEA" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">macOS (CoreGraphics)</text>
      <text x="20" y="58" fill="#9A978F" font-family="Inter, system-ui, sans-serif" font-size="12">• CGGetActiveDisplayList</text>
      <text x="20" y="78" fill="#9A978F" font-family="Inter, system-ui, sans-serif" font-size="12">• CGDisplayCopyAllDisplayModes</text>
      <text x="20" y="98" fill="#9A978F" font-family="Inter, system-ui, sans-serif" font-size="12">• ioreg IODisplayEDID reading</text>
    </g>

    <!-- Linux -->
    <g transform="translate(608, 0)">
      <rect width="280" height="114" rx="14" fill="#121215" stroke="#27272D" stroke-width="1" />
      <text x="20" y="32" fill="#F1EFEA" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Linux (X11 &amp; Wayland)</text>
      <text x="20" y="58" fill="#9A978F" font-family="Inter, system-ui, sans-serif" font-size="12">• xrandr query &amp; mode switch (X11)</text>
      <text x="20" y="78" fill="#9A978F" font-family="Inter, system-ui, sans-serif" font-size="12">• Mutter D-Bus / kscreen / wlr</text>
      <text x="20" y="98" fill="#9A978F" font-family="Inter, system-ui, sans-serif" font-size="12">• /sys/class/drm/*/edid reading</text>
    </g>
  </g>
</svg>
